[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.11, <3.14"

dependencies = [
    "anthropic>=0.40.0",  # Claude computer use tool
    "elevenlabs>=2.28.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.6",
    "livekit-agents[silero,turn-detector]~=1.3",
    "livekit-plugins-elevenlabs>=1.3.10",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.3.10",
    "openai>=1.60.0",
    "python-dotenv",
]

# Optional dependencies for enhanced features
[project.optional-dependencies]
observability = [
    "langfuse>=3.12.0",  # LangGraph tracing & observability
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Package discovery - find packages in src/
[tool.setuptools.packages.find]
where = ["src"]
include = ["cua*", "graphs*", "llm*", "models*", "state*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Entry point scripts for running the agent
[project.scripts]
neo-agent = "neo_agent:cli.run_app"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

